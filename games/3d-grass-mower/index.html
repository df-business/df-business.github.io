<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/logo.png" />
<title>3D 割草无双</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #14241a; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; user-select: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); padding: 16px 18px; }
  #hp-wrap { width: 260px; height: 16px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  #hp { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5f5f, #ff2d2d); border-radius: 999px; transition: width .12s linear; }
  .row { display: flex; gap: 18px; font-size: 15px; }
  .row b { color: #ffe16b; font-size: 17px; }

  #skills { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; pointer-events: none; }
  .skill { width: 64px; height: 64px; border-radius: 12px; background: rgba(20,30,24,.7); border: 2px solid rgba(255,255,255,.3); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .skill .key { font-size: 20px; font-weight: 800; }
  .skill .name { font-size: 11px; opacity: .9; }
  .skill .cd { position: absolute; inset: 0; background: rgba(0,0,0,.65); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #ffd24a; }
  .skill.flash { animation: up .2s ease; }
  @keyframes up { 0% { transform: translateY(0); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0); } }

  #combo { position: absolute; top: 18px; right: 20px; text-align: right; pointer-events: none; user-select: none; }
  #combo .n { font-size: 46px; font-weight: 900; color: #ffd24a; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
  #combo .t { font-size: 14px; letter-spacing: 2px; color: rgba(255,255,255,.85); }

  #damage-vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255,0,0,.0); transition: box-shadow .1s; }

  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(24,44,30,.82), rgba(8,16,12,.94)); color: #fff; flex-direction: column; text-align: center; z-index: 10; }
  #overlay h1 { font-size: 52px; margin: 0 0 8px; letter-spacing: 8px; color: #ffe16b; }
  #overlay p { font-size: 16px; color: #cfe9d0; margin: 7px 0; line-height: 1.9; }
  #overlay .btn { margin-top: 26px; padding: 15px 48px; font-size: 21px; font-weight: 800; letter-spacing: 4px; color: #1a2c14; background: linear-gradient(135deg, #ffe16b, #ffb347); border: none; border-radius: 999px; cursor: pointer; box-shadow: 0 8px 26px rgba(0,0,0,.4); }
  #overlay .btn:hover { transform: translateY(-2px); }
  .keycap { display: inline-block; min-width: 22px; padding: 1px 7px; margin: 0 2px; border-radius: 6px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); font-weight: 700; }
  #final { font-size: 58px; font-weight: 900; color: #ffd24a; margin: 6px 0; }
  #credits { margin-top: 30px; font-size: 12px; color: rgba(255,255,255,.5); line-height: 2; letter-spacing: 1px; }
  #credits b { color: rgba(255,255,255,.75); }
  #credits a { color: #ffe16b; text-decoration: none; }
  #credits a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app"></div>
<div id="damage-vignette"></div>

<div id="hud">
  <div id="hp-wrap"><div id="hp"></div></div>
  <div class="row"><span>波次 <b id="wave">1</b></span><span>击杀 <b id="kills">0</b></span><span>场上 <b id="alive">0</b></span></div>
</div>

<div id="combo"><div class="n" id="combo-n">0</div><div class="t">连击</div></div>

<div id="skills">
  <div class="skill" id="sk-q"><div class="key">Q</div><div class="name">旋风斩</div><div class="cd" style="display:none"></div></div>
  <div class="skill" id="sk-e"><div class="key">E</div><div class="name">冲刺</div><div class="cd" style="display:none"></div></div>
  <div class="skill" id="sk-r"><div class="key">R</div><div class="name">天崩</div><div class="cd" style="display:none"></div></div>
  <div class="skill" id="sk-space"><div class="key">S</div><div class="name">闪避</div><div class="cd" style="display:none"></div></div>
</div>

<div id="overlay">
  <h1>割草无双</h1>
  <p>操控勇士，用刀剑与技能收割蜂拥而来的敌人</p>
  <p><span class="keycap">W A S D</span>移动&nbsp;&nbsp;<span class="keycap">鼠标</span>转向（点击锁定）</p>
  <p><span class="keycap">长按左键</span>连续攻击&nbsp;&nbsp;<span class="keycap">Q</span>旋风斩&nbsp;&nbsp;<span class="keycap">E</span>冲刺&nbsp;&nbsp;<span class="keycap">R</span>天崩地裂</p>
  <p><span class="keycap">Shift</span>闪避&nbsp;&nbsp;<span class="keycap">空格</span>二段跳&nbsp;&nbsp;<span class="keycap">拾取</span>红心回血</p>
  <button class="btn" id="startBtn">开始战斗</button>
  <div id="credits">
    作者：<b>dfer</b><br>
    邮箱：<a href="mailto:df_business@qq.com">df_business@qq.com</a><br>
    QQ：<b>3504725309</b> · 网站：<a href="http://www.dfer.site" target="_blank">www.dfer.site</a>
  </div>
</div>

<script type="module">
import * as THREE from './three.module.js';

const app = document.getElementById('app');
const hpEl = document.getElementById('hp');
const waveEl = document.getElementById('wave');
const killsEl = document.getElementById('kills');
const aliveEl = document.getElementById('alive');
const comboEl = document.getElementById('combo-n');
const vignette = document.getElementById('damage-vignette');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa7d8ff);
scene.fog = new THREE.Fog(0xa7d8ff, 55, 150);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xeaf7ff, 0x5a7a4a, 0.95));
const sun = new THREE.DirectionalLight(0xfff2cf, 1.5);
sun.position.set(30, 55, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 220;
scene.add(sun);

const RANGE = 42;
const ground = new THREE.Mesh(new THREE.CircleGeometry(RANGE + 8, 64), new THREE.MeshLambertMaterial({ color: 0x6fae4e }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(RANGE + 8, RANGE + 30, 64), new THREE.MeshLambertMaterial({ color: 0x4c8a44 }));
ring.rotation.x = -Math.PI / 2;
scene.add(ring);

const grassGeo = (() => { const g = new THREE.ConeGeometry(0.09, 0.8, 5); g.translate(0, 0.4, 0); return g; })();
const grassMat = new THREE.MeshLambertMaterial({ color: 0x4f9c3a });
const grass = new THREE.InstancedMesh(grassGeo, grassMat, 5000);
grass.receiveShadow = true;
scene.add(grass);
{
  const d = new THREE.Object3D();
  for (let i = 0; i < 5000; i++) {
    const r = Math.sqrt(Math.random()) * (RANGE + 6);
    const a = Math.random() * Math.PI * 2;
    d.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    d.rotation.set(0, Math.random() * Math.PI, 0);
    const s = 0.6 + Math.random();
    d.scale.set(s, s + Math.random() * 0.5, s);
    d.updateMatrix();
    grass.setMatrixAt(i, d.matrix);
  }
  grass.instanceMatrix.needsUpdate = true;
}
for (let i = 0; i < 20; i++) {
  const a = Math.random() * Math.PI * 2, r = RANGE + 16 + Math.random() * 16;
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3.5, 7), new THREE.MeshLambertMaterial({ color: 0x7a5a38 }));
  t.position.set(Math.cos(a) * r, 1.75, Math.sin(a) * r);
  t.castShadow = true; scene.add(t);
  const c = new THREE.Mesh(new THREE.ConeGeometry(2.4, 4.5, 8), new THREE.MeshLambertMaterial({ color: 0x2f7f3a }));
  c.position.set(Math.cos(a) * r, 5.2, Math.sin(a) * r);
  c.castShadow = true; scene.add(c);
}

function buildPlayer() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3b7bff });
  const dark = new THREE.MeshLambertMaterial({ color: 0x22304a });
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.0, 10), bodyMat);
  torso.position.y = 1.05; torso.castShadow = true; g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshLambertMaterial({ color: 0xf2c79a }));
  head.position.y = 1.85; head.castShadow = true; g.add(head);
  const helm = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.4, 10), new THREE.MeshLambertMaterial({ color: 0xdfe6f2 }));
  helm.position.y = 2.15; g.add(helm);
  const pivot = new THREE.Group();
  pivot.position.set(0, 1.2, 0);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 1.7), new THREE.MeshLambertMaterial({ color: 0xe8eaf0 }));
  blade.position.set(0.55, 0.1, 0.55); blade.castShadow = true;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.45, 6), new THREE.MeshLambertMaterial({ color: 0xe8eaf0 }));
  tip.rotation.x = -Math.PI / 2; tip.position.set(0.55, 0.1, 1.5);
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.05), dark);
  guard.position.set(0.55, 0.1, 0.45);
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 6), dark);
  grip.position.set(0.55, 0.1, 0.25);
  pivot.add(blade, tip, guard, grip);
  g.add(pivot);
  g.userData.pivot = pivot;
  return g;
}

const player = buildPlayer();
scene.add(player);

const MAX_ENEMIES = 260;
const enemies = [];
for (let i = 0; i < MAX_ENEMIES; i++) enemies.push({ slot: i, alive: false, dying: 0, type: null, x: 0, z: 0, hp: 0, maxHp: 0, face: 0, flash: 0, atkCd: 0, speed: 0, dmg: 0, scale: 1, kbx: 0, kbz: 0 });

const bodyGeo = new THREE.CylinderGeometry(0.42, 0.55, 1.15, 8); bodyGeo.translate(0, 0.6, 0);
const headGeo = new THREE.IcosahedronGeometry(0.3, 0); headGeo.translate(0, 1.4, 0);
const weaponGeo = new THREE.ConeGeometry(0.15, 0.85, 6); weaponGeo.rotateX(-Math.PI / 2); weaponGeo.translate(0.55, 0.75, 0.3);
const eBody = new THREE.InstancedMesh(bodyGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), MAX_ENEMIES);
const eHead = new THREE.InstancedMesh(headGeo, new THREE.MeshLambertMaterial({ color: 0x2b2630 }), MAX_ENEMIES);
const eWeapon = new THREE.InstancedMesh(weaponGeo, new THREE.MeshLambertMaterial({ color: 0xd8dce4 }), MAX_ENEMIES);
eBody.castShadow = true; eHead.castShadow = true; eWeapon.castShadow = true;
eBody.frustumCulled = false; eHead.frustumCulled = false; eWeapon.frustumCulled = false;
scene.add(eBody, eHead, eWeapon);
const dObj = new THREE.Object3D();
const white = new THREE.Color(0xffffff);
{
  dObj.position.set(0, -20, 0); dObj.rotation.set(0, 0, 0); dObj.scale.setScalar(0.0001); dObj.updateMatrix();
  for (let i = 0; i < MAX_ENEMIES; i++) { eBody.setMatrixAt(i, dObj.matrix); eHead.setMatrixAt(i, dObj.matrix); eWeapon.setMatrixAt(i, dObj.matrix); eBody.setColorAt(i, white); }
  eBody.instanceMatrix.needsUpdate = true; eHead.instanceMatrix.needsUpdate = true; eWeapon.instanceMatrix.needsUpdate = true;
  if (eBody.instanceColor) eBody.instanceColor.needsUpdate = true;
}

const TYPES = {
  normal: { scale: 1.0, hp: 40, speed: 3.2, dmg: 8, color: new THREE.Color(0x4db86b) },
  fast:   { scale: 0.72, hp: 24, speed: 6.0, dmg: 5, color: new THREE.Color(0xf0a332) },
  tank:   { scale: 1.7, hp: 160, speed: 2.0, dmg: 16, color: new THREE.Color(0xc9483d) }
};
function pickType() {
  const r = Math.random();
  if (r < 0.55) return 'normal';
  if (r < 0.82) return 'fast';
  return 'tank';
}
function spawnEnemy() {
  let slot = -1;
  for (let i = 0; i < MAX_ENEMIES; i++) if (!enemies[i].alive && enemies[i].dying <= 0) { slot = i; break; }
  if (slot < 0) return;
  const t = TYPES[pickType()];
  const e = enemies[slot];
  const a = Math.random() * Math.PI * 2, r = 30 + Math.random() * 14;
  e.alive = true; e.dying = 0; e.type = t;
  e.x = player.position.x + Math.cos(a) * r;
  e.z = player.position.z + Math.sin(a) * r;
  e.maxHp = Math.round(t.hp * hpScale); e.hp = e.maxHp;
  e.speed = t.speed * (0.85 + Math.random() * 0.3);
  e.dmg = t.dmg; e.scale = t.scale;
  e.flash = 0; e.atkCd = Math.random() * 0.5; e.kbx = 0; e.kbz = 0; e.face = 0;
  aliveCount++;
}

const MAX_PART = 700;
const pPos = new Float32Array(MAX_PART * 3);
const pVel = new Float32Array(MAX_PART * 3);
const pLife = new Float32Array(MAX_PART);
const pCol = new Float32Array(MAX_PART * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
for (let i = 0; i < MAX_PART; i++) pPos.set([0, -100, 0], i * 3);
const pMat = new THREE.PointsMaterial({ vertexColors: true, size: 0.35, transparent: true, opacity: 0.95, depthWrite: false });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);
let pHead = 0;
function burst(x, y, z, color, n, sp) {
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++) {
    const i = pHead; pHead = (pHead + 1) % MAX_PART;
    pPos.set([x, y, z], i * 3);
    const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI - Math.PI / 2;
    const v = sp * (0.3 + Math.random());
    pVel.set([Math.cos(th) * Math.cos(ph) * v, Math.sin(ph) * v + sp * 0.4, Math.sin(th) * Math.cos(ph) * v], i * 3);
    pLife[i] = 0.5 + Math.random() * 0.5;
    pCol.set([c.r, c.g, c.b], i * 3);
  }
}

function fanGeom(radius, angle) {
  const seg = 14, pos = [];
  for (let i = 0; i < seg; i++) {
    const a0 = -angle / 2 + angle * (i / seg);
    const a1 = -angle / 2 + angle * ((i + 1) / seg);
    pos.push(0, 0, 0, radius * Math.cos(a0), 0, radius * Math.sin(a0), radius * Math.cos(a1), 0, radius * Math.sin(a1));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
const slashFan = fanGeom(3.4, Math.PI * 0.75);
const slashPool = [];
for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(slashFan, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.position.y = 0.85; m.rotation.x = -Math.PI / 2; m.visible = false;
  scene.add(m); slashPool.push({ m, life: 0 });
}
const ringGeo = new THREE.RingGeometry(0.85, 1, 48);
const ringPool = [];
for (let i = 0; i < 10; i++) {
  const col = i % 2 === 0 ? 0xffe08a : 0xffffff;
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.4; m.visible = false;
  scene.add(m); ringPool.push({ m, life: 0, max: 1, grow: 1 });
}
function playRing(x, z, maxR, dur, y) {
  const r = ringPool.find(o => o.life <= 0);
  if (!r) return;
  r.life = dur; r.max = dur; r.grow = maxR; r.m.position.set(x, y || 0.4, z);
  r.m.visible = true;
}

const drops = [];
const MAX_DROPS = 30;
function makeHeartTex() {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, 64, 64);
  c.beginPath();
  c.moveTo(32, 54);
  c.bezierCurveTo(8, 38, 6, 18, 18, 10);
  c.bezierCurveTo(26, 5, 32, 10, 32, 18);
  c.bezierCurveTo(32, 10, 38, 5, 46, 10);
  c.bezierCurveTo(58, 18, 56, 38, 32, 54);
  c.closePath();
  const g = c.createLinearGradient(0, 0, 0, 64);
  g.addColorStop(0, '#ff7a8a'); g.addColorStop(1, '#e0273d');
  c.fillStyle = g; c.fill();
  c.lineWidth = 3; c.strokeStyle = '#fff'; c.stroke();
  return new THREE.CanvasTexture(cv);
}
const heartTex = makeHeartTex();
for (let i = 0; i < MAX_DROPS; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTex, transparent: true, depthWrite: false }));
  sp.scale.set(1.1, 1.1, 1);
  sp.visible = false;
  scene.add(sp);
  drops.push({ sp, life: 0, x: 0, z: 0 });
}
function dropHeart(x, z) {
  const d = drops.find(o => o.life <= 0);
  if (!d) return;
  d.life = 12; d.x = x; d.z = z;
  d.sp.visible = true;
}
function heal(amount) {
  playerHp = Math.min(100, playerHp + amount);
  hpEl.style.width = Math.max(playerHp, 0) + '%';
  sfx('hit');
}

const texts = [];
function addText(str, x, y, z, color, big) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.font = (big ? 'bold 44px' : 'bold 36px') + ' "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6;
  ctx.fillStyle = color; ctx.fillText(str, 64, 34);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const s = big ? 2.6 : 2.0;
  sp.scale.set(s, s / 2, 1);
  sp.position.set(x, y, z);
  scene.add(sp);
  texts.push({ sp, life: 1.0, tex });
}

let audioCtx;
function sfx(type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const mk = (wave, f0, f1, dur, vol) => {
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = wave; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(gn).connect(audioCtx.destination); o.start(t); o.stop(t + dur);
    };
    if (type === 'slash') mk('square', 900, 180, 0.1, 0.12);
    else if (type === 'hit') mk('triangle', 300, 120, 0.08, 0.15);
    else if (type === 'die') mk('sawtooth', 260, 50, 0.18, 0.16);
    else if (type === 'whirl') mk('sawtooth', 200, 500, 0.6, 0.12);
    else if (type === 'dash') mk('sine', 500, 900, 0.15, 0.12);
    else if (type === 'boom') { mk('sine', 120, 30, 0.7, 0.4); mk('square', 500, 60, 0.3, 0.15); }
    else if (type === 'hurt') mk('sawtooth', 160, 60, 0.25, 0.2);
  } catch (e) {}
}

const keys = {};
let mouseDown = false;
let velY = 0, grounded = true, jumps = 0;
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'BUTTON')) return;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (started) {
    if (e.code === 'KeyQ') castWhirlwind();
    else if (e.code === 'KeyE') castDash();
    else if (e.code === 'KeyR') castBoom();
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { if (!e.repeat) dodge(); }
    else if (e.code === 'Space') { if (!e.repeat) jump(); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) {
    if (!started) return;
    if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
    mouseDown = true;
    attack();
  }
});
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    cameraYaw -= e.movementX * 0.0035;
    cameraPitch = Math.max(0.15, Math.min(1.3, cameraPitch + e.movementY * 0.003));
  }
});

const skills = {
  q: { cd: 0, max: 6, el: document.getElementById('sk-q') },
  e: { cd: 0, max: 4, el: document.getElementById('sk-e') },
  r: { cd: 0, max: 14, el: document.getElementById('sk-r') },
  shift: { cd: 0, max: 1.6, el: document.getElementById('sk-space') }
};
function useSkill(name) {
  const s = skills[name];
  if (s.cd > 0) return false;
  s.cd = s.max;
  const el = s.el.querySelector('.cd');
  return true;
}

let started = false, over = false;
let playerHp = 100, kills = 0, combo = 0, comboTimer = 0, wave = 1, aliveCount = 0, hpScale = 1;
let cameraYaw = -Math.PI / 4, cameraPitch = 0.85, cameraDist = 10;
let mowerAngle = 0;
let spawnAcc = 0, waveTimer = 0;
let attackCd = 0, swing = 0;
let hurtFlash = 0, shake = 0;
let dashT = 0, dashLen = 0, dashDirX = 0, dashDirZ = 0, invul = 0;
const clock = new THREE.Clock();

function startGame() {
  started = true; over = false;
  playerHp = 100; kills = 0; combo = 0; wave = 1; aliveCount = 0; hpScale = 1;
  spawnAcc = 0; waveTimer = 0; attackCd = 0; dashT = 0; invul = 0; hurtFlash = 0;
  player.position.set(0, 0, 0); player.rotation.y = 0; cameraYaw = -Math.PI / 4;
  velY = 0; grounded = true; jumps = 0; mouseDown = false;
  for (const e of enemies) { e.alive = false; e.dying = 0; }
  for (const d of drops) { d.life = 0; d.sp.visible = false; }
  overlay.style.display = 'none';
  sfx('boom');
  for (let i = 0; i < 16; i++) spawnEnemy();
  renderer.domElement.requestPointerLock();
}
startBtn.addEventListener('click', startGame);

function endGame() {
  over = true; started = false;
  document.exitPointerLock && document.exitPointerLock();
  overlay.style.display = 'flex';
  overlay.innerHTML =
    '<h1>战斗结束</h1>' +
    '<div id="final">' + kills + '</div>' +
    '<p>总击杀 · 最高波次 ' + wave + '</p>' +
    '<button class="btn" id="reBtn">再来一局</button>';
  document.getElementById('reBtn').addEventListener('click', startGame);
}

function damagePlayer(d) {
  if (invul > 0 || !started) return;
  playerHp -= d; hurtFlash = 0.3; sfx('hurt');
  if (playerHp <= 0) { playerHp = 0; endGame(); }
}

function hitArea(cx, cz, radius, dmg, knock, knockDir) {
  let n = 0;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - cx, dz = e.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < radius * radius) {
      e.hp -= dmg; e.flash = 0.12; n++;
      if (knockDir) { const d = Math.sqrt(d2) || 0.001; e.kbx = knockDir.x * knock; e.kbz = knockDir.z * knock; }
      else { const d = Math.sqrt(d2) || 0.001; e.kbx += dx / d * knock; e.kbz += dz / d * knock; }
      burst(e.x, 1, e.z, 0xfff2a8, 6, 5);
      if (e.hp <= 0) killEnemy(e);
    }
  }
  return n;
}
function hitArc(cx, cz, facingYaw, radius, halfAngle, dmg, knock) {
  let n = 0;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - cx, dz = e.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 > radius * radius) continue;
    let ang = Math.atan2(dx, dz) - facingYaw;
    while (ang > Math.PI) ang -= Math.PI * 2;
    while (ang < -Math.PI) ang += Math.PI * 2;
    if (Math.abs(ang) > halfAngle) continue;
    e.hp -= dmg; e.flash = 0.12; n++;
    const d = Math.sqrt(d2) || 0.001;
    e.kbx += dx / d * knock; e.kbz += dz / d * knock;
    burst(e.x, 1, e.z, 0xfff2a8, 6, 5);
    if (e.hp <= 0) killEnemy(e);
  }
  return n;
}
function killEnemy(e) {
  e.alive = false; e.dying = 0.28;
  aliveCount--; kills++; combo++; comboTimer = 3;
  burst(e.x, 1.2, e.z, e.type.color, 14, 6);
  addText('+' + e.type.maxHp ? '' : '1', e.x, 1.8, e.z, '#ffffff');
  if (Math.random() < 0.24) dropHeart(e.x, e.z);
  sfx('die');
}

function attack() {
  if (attackCd > 0) return;
  attackCd = 0.32; swing = 0.28;
  const n = hitArc(player.position.x, player.position.z, player.rotation.y, 3.4, Math.PI * 0.75, 36, 5);
  const s = slashPool.find(o => o.life <= 0);
  if (s) { s.life = 0.18; s.max = 0.18; s.m.visible = true; s.m.rotation.y = player.rotation.y; }
  sfx(n ? 'hit' : 'slash');
}
function castWhirlwind() {
  if (useSkill('q')) {
    sfx('whirl');
    playRing(player.position.x, player.position.z, 6, 0.55, 0.3);
    burst(player.position.x, 1, player.position.z, 0x9fe8ff, 40, 8);
    let pulses = 0;
    const iv = setInterval(() => {
      if (!started) { clearInterval(iv); return; }
      hitArea(player.position.x, player.position.z, 5.5, 30, 3, null);
      burst(player.position.x, 1, player.position.z, 0x9fe8ff, 10, 6);
      if (++pulses >= 3) clearInterval(iv);
    }, 180);
  }
}
function castDash() {
  if (useSkill('e')) {
    const f = player.rotation.y;
    dashDirX = Math.sin(f); dashDirZ = Math.cos(f);
    dashT = 0.22; dashLen = 8; invul = Math.max(invul, 0.3);
    sfx('dash');
    let prev = { x: player.position.x, z: player.position.z };
    hitArea(prev.x, prev.z, 2.2, 45, 6, { x: dashDirX, z: dashDirZ });
  }
}
function castBoom() {
  if (useSkill('r')) {
    sfx('boom'); shake = 0.6;
    playRing(player.position.x, player.position.z, 16, 0.7, 0.3);
    burst(player.position.x, 1, player.position.z, 0xffd24a, 70, 12);
    hitArea(player.position.x, player.position.z, 16, 140, 10, null);
  }
}
function dodge() {
  if (useSkill('shift')) {
    const f = player.rotation.y;
    dashDirX = Math.sin(f); dashDirZ = Math.cos(f);
    dashT = 0.18; dashLen = 5; invul = 0.35;
    sfx('dash');
  }
}
function jump() {
  if (!grounded) {
    if (jumps >= 1) return;
    jumps++;
    velY = 8;
    grounded = false;
    sfx('dash');
  } else {
    jumps = 0;
    grounded = false;
    velY = 9;
    sfx('dash');
  }
}

const grid = new Map();
const CELL = 1.8;
function gridKey(cx, cz) { return cx * 10007 + cz; }
function buildGrid() {
  grid.clear();
  for (const e of enemies) {
    if (!e.alive) continue;
    grid.set(gridKey(Math.floor(e.x / CELL), Math.floor(e.z / CELL)), e);
  }
}
function separation(e) {
  const gx = Math.floor(e.x / CELL), gz = Math.floor(e.z / CELL);
  let sx = 0, sz = 0;
  for (let ox = -1; ox <= 1; ox++) for (let oz = -1; oz <= 1; oz++) {
    const other = grid.get(gridKey(gx + ox, gz + oz));
    if (!other || other === e || !other.alive) continue;
    const dx = e.x - other.x, dz = e.z - other.z;
    const d2 = dx * dx + dz * dz;
    const min = 1.3 * (e.scale + other.scale) / 2 + 0.2;
    if (d2 < min * min && d2 > 0.0001) { const d = Math.sqrt(d2); sx += dx / d * (min - d); sz += dz / d * (min - d); }
  }
  return [sx * 2.2, sz * 2.2];
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (started) {
    let fwd = 0, strafe = 0;
    if (keys['KeyW']) fwd += 1;
    if (keys['KeyS']) fwd -= 1;
    if (keys['KeyA']) strafe += 1;
    if (keys['KeyD']) strafe -= 1;
    const fx = Math.sin(cameraYaw), fz = Math.cos(cameraYaw);
    const rx = fz, rz = -fx;
    let vx = fx * fwd + rx * strafe;
    let vz = fz * fwd + rz * strafe;
    const vl = Math.hypot(vx, vz);
    if (vl > 0.0001) { vx /= vl; vz /= vl; if (dashT <= 0) player.rotation.y = Math.atan2(vx, vz); }

    let spd = 8;
    if (dashT > 0) {
      dashT -= dt;
      player.position.x += dashDirX * (dashLen / 0.22) * dt;
      player.position.z += dashDirZ * (dashLen / 0.22) * dt;
      burst(player.position.x, 0.6, player.position.z, 0xffffff, 3, 4);
      hitArea(player.position.x, player.position.z, 2.4, 25, 6, { x: dashDirX, z: dashDirZ });
    } else {
      player.position.x += vx * spd * dt;
      player.position.z += vz * spd * dt;
    }
    velY -= 20 * dt;
    player.position.y += velY * dt;
    if (player.position.y <= 0) { player.position.y = 0; velY = 0; grounded = true; jumps = 0; }
    const pr = Math.hypot(player.position.x, player.position.z);
    if (pr > RANGE - 1) { player.position.x *= (RANGE - 1) / pr; player.position.z *= (RANGE - 1) / pr; }

    if (swing > 0) {
      swing -= dt;
      const t = 1 - Math.max(swing, 0) / 0.28;
      player.userData.pivot.rotation.y = Math.sin(t * Math.PI) * 2.2 + 0.6;
    }
    attackCd -= dt; invul -= dt;
    if (mouseDown && attackCd <= 0) attack();

    waveTimer += dt;
    if (waveTimer > 22) { waveTimer = 0; wave++; hpScale = 1 + (wave - 1) * 0.22; addText('第 ' + wave + ' 波!', player.position.x, 3, player.position.z, '#ffd24a', true); }
    spawnAcc += (5 + wave * 2.0) * dt;
    while (spawnAcc >= 1) { spawnAcc -= 1; if (aliveCount < MAX_ENEMIES - 4) spawnEnemy(); }

    buildGrid();
    for (const e of enemies) {
      if (e.dying > 0) {
        e.dying -= dt;
        const s = e.scale * Math.max(e.dying / 0.28, 0);
        dObj.position.set(e.x, 0, e.z); dObj.rotation.y = e.face; dObj.scale.setScalar(s); dObj.updateMatrix();
        eBody.setMatrixAt(e.slot, dObj.matrix); eHead.setMatrixAt(e.slot, dObj.matrix); eWeapon.setMatrixAt(e.slot, dObj.matrix);
        continue;
      }
      if (!e.alive) continue;
      const dx = player.position.x - e.x, dz = player.position.z - e.z;
      const dist = Math.hypot(dx, dz) || 0.001;
      const nx = dx / dist, nz = dz / dist;
      const [sx, sz] = separation(e);
      const mvx = nx * e.speed + sx + e.kbx;
      const mvz = nz * e.speed + sz + e.kbz;
      e.x += mvx * dt; e.z += mvz * dt;
      e.kbx *= (1 - 6 * dt); e.kbz *= (1 - 6 * dt);
      e.face = Math.atan2(mvx, mvz) || e.face;
      e.flash -= dt;
      if (dist < 1.1 * e.scale) { e.atkCd -= dt; if (e.atkCd <= 0) { damagePlayer(e.dmg); e.atkCd = 1.0; } }
      const bob = Math.sin(performance.now() * 0.012 + e.slot) * 0.08;
      dObj.position.set(e.x, bob, e.z); dObj.rotation.y = e.face; dObj.scale.setScalar(e.scale); dObj.updateMatrix();
      eBody.setMatrixAt(e.slot, dObj.matrix); eHead.setMatrixAt(e.slot, dObj.matrix); eWeapon.setMatrixAt(e.slot, dObj.matrix);
      eBody.setColorAt(e.slot, e.flash > 0 ? white : e.type.color);
    }
    eBody.instanceMatrix.needsUpdate = true; eHead.instanceMatrix.needsUpdate = true; eWeapon.instanceMatrix.needsUpdate = true;
    eBody.instanceColor.needsUpdate = true;

    for (const d of drops) {
      if (d.life <= 0) continue;
      d.life -= dt;
      if (d.life <= 0) { d.sp.visible = false; continue; }
      const dx = player.position.x - d.x, dz = player.position.z - d.z;
      const d2 = dx * dx + dz * dz;
      if (d2 < 1.6 * 1.6) {
        heal(12);
        d.life = 0;
        d.sp.visible = false;
        burst(d.x, 1, d.z, 0xff5f78, 10, 5);
        continue;
      }
      if (d2 < 64) {
        const dd = Math.sqrt(d2);
        d.x += dx / dd * 2.2 * dt;
        d.z += dz / dd * 2.2 * dt;
      }
      const bob = Math.sin(performance.now() * 0.004 + d.x) * 0.2;
      d.sp.position.set(d.x, 0.8 + bob, d.z);
    }

    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

    hurtFlash -= dt;
    vignette.style.boxShadow = hurtFlash > 0 ? 'inset 0 0 140px 40px rgba(255,20,30,' + (hurtFlash * 2) + ')' : 'inset 0 0 0 0 rgba(0,0,0,0)';
  }

  shake = Math.max(0, shake - dt * 2);

  for (const o of slashPool) {
    if (o.life > 0) { o.life -= dt; o.m.material.opacity = Math.max(o.life / o.max, 0); if (o.life <= 0) o.m.visible = false; }
  }
  for (const o of ringPool) {
    if (o.life > 0) {
      o.life -= dt;
      const p = Math.max(o.life / o.max, 0);
      o.m.scale.setScalar(o.grow * (1 - p) + 0.5);
      o.m.material.opacity = p;
      if (o.life <= 0) o.m.visible = false;
    }
  }

  for (let i = 0; i < MAX_PART; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt;
    pVel[i * 3 + 1] -= 11 * dt;
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0.06) { pVel[i * 3 + 1] *= -0.3; pVel[i * 3] *= 0.6; pVel[i * 3 + 2] *= 0.6; pPos[i * 3 + 1] = 0.06; }
    if (pLife[i] <= 0) pPos.set([0, -100, 0], i * 3);
  }
  pGeo.attributes.position.needsUpdate = true;

  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt * 1.1;
    t.sp.position.y += dt * 2.2;
    if (t.life <= 0) { scene.remove(t.sp); t.sp.material.dispose(); t.tex.dispose(); texts.splice(i, 1); }
  }

  for (const n in skills) {
    const s = skills[n];
    if (s.cd > 0) s.cd -= dt;
    const cdel = s.el.querySelector('.cd');
    if (s.cd > 0) { cdel.style.display = 'flex'; cdel.textContent = Math.ceil(s.cd); }
    else cdel.style.display = 'none';
  }

  const shx = (Math.random() - 0.5) * shake, shz = (Math.random() - 0.5) * shake;
  const cp = player.position;
  const camX = cp.x - Math.sin(cameraYaw) * Math.cos(cameraPitch) * cameraDist + shx;
  const camY = cp.y + 3 + Math.sin(cameraPitch) * cameraDist;
  const camZ = cp.z - Math.cos(cameraYaw) * Math.cos(cameraPitch) * cameraDist + shz;
  camera.position.set(camX, camY, camZ);
  camera.lookAt(cp.x, cp.y + 1.4, cp.z);

  hpEl.style.width = Math.max(playerHp, 0) + '%';
  waveEl.textContent = wave;
  killsEl.textContent = kills;
  aliveEl.textContent = aliveCount;
  comboEl.textContent = combo;
  comboEl.style.opacity = combo >= 2 ? 1 : 0.2;

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
